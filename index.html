<style>
:root{--g:#43B02A;--gd:#215732;--gl:#eaf6e6;--bg:#f3f6f3;--card:#fff;--ink:#1c2a21;--mute:#5f6d64;--line:#dbe4dd;--bad:#b42318;--badbg:#fdecea;--warn:#8a5a00;--warnbg:#fff6e0;--r:10px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button,input,select{font:inherit}
.hidden{display:none!important}
/* loading bar */
#busy{position:fixed;top:0;left:0;height:3px;width:0;background:var(--g);z-index:99;transition:width .3s}
#busy.on{width:80%;transition:width 8s cubic-bezier(.1,.7,.2,1)}
/* login */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--gd),#2e7a3a 60%,var(--g));padding:20px}
.login-card{background:#fff;border-radius:14px;padding:34px 30px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.logo-img{height:46px;width:auto;display:block;padding-right:12px;border-right:1px solid var(--line)}
header .logo-img{height:30px;border-right-color:rgba(255,255,255,.35)}
.login-card .brand{flex-direction:column;align-items:center;text-align:center;gap:8px}
.login-card .logo-img{height:58px;padding-right:0;border-right:0}
.brand b{display:block;font-size:17px;color:var(--gd)}
.brand span{font-size:12px;color:var(--mute)}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--g);outline-offset:-1px;border-color:var(--g)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--g);background:var(--g);color:#fff;padding:8px 15px;border-radius:8px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--gd);border-color:var(--gd)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--gd);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--g);background:var(--gl)}
.btn.danger{background:#fff;color:var(--bad);border-color:#f0c4bf}
.btn.danger:hover{background:var(--badbg)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.block{width:100%;justify-content:center;margin-top:20px;padding:11px}
.link{background:none;border:0;padding:0;color:var(--gd);font-weight:600;cursor:pointer;text-decoration:underline}
.login-card h2{margin:0 0 6px;font-size:18px;color:var(--gd)}
.msg{margin-top:12px;padding:9px 12px;border-radius:8px;font-size:13px}
.msg.bad{background:var(--badbg);color:var(--bad)}
.msg.ok{background:var(--gl);color:var(--gd)}
.msg.warn{background:var(--warnbg);color:var(--warn)}
/* shell */
#app{display:grid;grid-template-columns:240px 1fr;grid-template-rows:56px 1fr;min-height:100%}
header{grid-column:1/3;background:var(--gd);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
header .brand{margin:0}
header .brand b{color:#fff}
header .brand span{color:#cfe6d2}
.who{display:flex;align-items:center;gap:12px;font-size:13px}
.who .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}

nav{background:#fff;border-right:1px solid var(--line);padding:14px 10px;overflow:auto}
nav h6{margin:16px 10px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute)}
nav button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--ink)}
nav button:hover{background:var(--bg)}
nav button.on{background:var(--gl);color:var(--gd);font-weight:700;box-shadow:inset 3px 0 0 var(--g)}
main{padding:24px 28px;overflow:auto}
h1{font-size:21px;margin:0 0 4px;color:var(--gd)}
.sub{color:var(--mute);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}

.drop:hover,.drop.over{border-color:var(--g);background:var(--gl)}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:60vh}
table{border-collapse:collapse;width:100%;font-size:13px;background:#fff}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#f6f9f6;position:sticky;top:0;z-index:1;font-weight:700;color:var(--gd)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.err td{background:var(--badbg)}
tfoot td{font-weight:700;background:#f6f9f6;position:sticky;bottom:0}
.muted{color:var(--mute);font-size:12.5px}
.secret{font-family:Consolas,monospace;font-size:16px;background:var(--gl);border:1px solid var(--g);padding:10px 14px;border-radius:8px;display:inline-block;margin:6px 0;user-select:all}
/* modal & toast */
.overlay{position:fixed;inset:0;background:rgba(15,30,20,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{margin:0 0 8px;font-size:18px;color:var(--gd)}
#toast{position:fixed;bottom:20px;right:20px;z-index:60;display:flex;flex-direction:column;gap:8px}
#toast div{background:var(--gd);color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:360px}

@media (max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:56px auto 1fr}nav{border-right:0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px}nav h6{display:none}nav button{width:auto}main{padding:16px}.who span{display:none}}
</style>

<body>
<div id="busy"></div>

<!-- ============ LOGIN ============ -->
<section id="login" class="hidden">
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="brand"><img class="logo-img" src="assets/crdb-logo.png" alt="CRDB Bank"><div><b>Brokerage Portal</b><span>Trial balance &amp; reconciliation</span></div></div>
    <label for="lu">Username or work email</label>
    <input id="lu" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="e.g. knjelekela or name@crdbbank.co.tz" required>
    <label for="lp">Password</label>
    <input id="lp" type="password" autocomplete="current-password" required>
    <button class="btn block" id="loginBtn" type="submit">Sign in</button>
    <div id="loginMsg"></div>
    <p class="muted" style="margin-top:18px">First time here? <button type="button" class="link" id="toSetup">New user setup</button><br>
      Forgot your password? <button type="button" class="link" id="toReset">Reset it</button></p>
  </form>
  <form class="login-card hidden" id="pinForm" autocomplete="off" novalidate>
    <div class="brand"><img class="logo-img" src="assets/crdb-logo.png" alt="CRDB Bank"><div><b>Brokerage Portal</b><span>Trial balance &amp; reconciliation</span></div></div>
    <h2 id="pinTitle">New user setup</h2>
    <p class="muted" id="pinIntro"></p>
    <label for="pe">Work email</label>
    <input id="pe" type="email" autocomplete="email" placeholder="name@crdbbank.co.tz">
    <button type="button" class="btn block" id="pinSend">Send me a code</button>
    <p class="muted" id="haveCodeP" style="margin:10px 0 0"><button type="button" class="link" id="haveCode">I already have a code</button></p>
    <div id="pinMsg"></div>
    <div id="pinStep2" class="hidden">
      <label for="pp">6-digit code from the email</label>
      <input id="pp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="e.g. 123456">
      <label for="pn1">New password</label>
      <input id="pn1" type="password" autocomplete="new-password">
      <label for="pn2">Confirm new password</label>
      <input id="pn2" type="password" autocomplete="new-password">
      <p class="muted">At least 8 characters, with letters and numbers.</p>
      <button class="btn block" id="pinBtn" type="submit">Set password and sign in</button>
    </div>
    <p class="muted" style="margin-top:18px"><button type="button" class="link" id="toLogin">← Back to sign in</button></p>
  </form>
</section>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header>
    <div class="brand"><img class="logo-img" src="assets/crdb-logo-white.png" alt="CRDB Bank"><div><b>Brokerage Portal</b><span>Trial balance &amp; reconciliation</span></div></div>
    <div class="who"><span id="whoName"></span>
      <button class="btn ghost sm" id="pwBtn" type="button">Change password</button>
      <button class="btn ghost sm" id="outBtn" type="button">Sign out</button>
    </div>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<div id="toast"></div>

<script>
(function () {
'use strict';

/* ---------------- helpers ---------------- */
const $ = (s, el) => (el || document).querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { sessionStorage.removeItem(k); } catch (e) {} }
};
const fmt = n => (typeof n === 'number' && isFinite(n)) ? n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : esc(n);
const keyOf = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');

const S = { token: store.get('bp_token'), user: null, modules: [], view: 'dashboard', mod: null, tab: 'manual', auditUser: '' };
const ROLE_LABEL = { master: 'Master admin', admin: 'Administrator', user: 'User' };
const isAdmin = () => !!S.user && (S.user.role === 'admin' || S.user.role === 'master');
const isMaster = () => !!S.user && S.user.role === 'master';
const strongPw = p => p.length >= 8 && /[A-Za-z]/.test(p) && /[0-9]/.test(p);

let busyCount = 0;
function busy(on) {
  busyCount += on ? 1 : -1;
  const b = $('#busy');
  if (busyCount > 0) { b.classList.add('on'); } else { busyCount = 0; b.classList.remove('on'); b.style.width = '100%'; setTimeout(() => { b.style.width = ''; }, 250); }
}

function toast(text, kind) {
  const d = document.createElement('div');
  if (kind) d.className = kind;
  d.textContent = text;
  $('#toast').appendChild(d);
  setTimeout(() => d.remove(), 4500);
}

async function api(action, data) {
  if (!API_URL || API_URL.indexOf('PASTE_') === 0) throw new Error('Portal not connected: API_URL is not set in index.html.');
  busy(true);
  try {
    let res;
    try {
      res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action: action, token: S.token }, data || {})) });
    } catch (e) { throw new Error('Could not reach the server. Check your internet connection.'); }
    let out;
    try { out = await res.json(); } catch (e) { throw new Error('Unexpected server reply. Check the Apps Script deployment (Who has access: Anyone).'); }
    if (!out.ok) {
      const err = new Error(out.error || 'Request failed.');
      err.code = out.code;
      if (out.code === 'SESSION_EXPIRED') { signOutLocal(); }
      if (out.code === 'PASSWORD_CHANGE_REQUIRED') { changePassword(true); }
      throw err;
    }
    return out;
  } finally { busy(false); }
}

/* ---------- page memory: show what was loaded before at once, then refresh quietly ---------- */
const CACHE = new Map(), INFLIGHT = new Map();
const FRESH_MS = 15000;           // within 15 s of the last load, do not ask the server again
let GEN = 0;                      // bumps whenever data changes, so older answers are not remembered
function clearCache() { GEN++; CACHE.clear(); INFLIGHT.clear(); }
function dropCache(prefix) {
  GEN++;
  [CACHE, INFLIGHT].forEach(mp => Array.from(mp.keys()).forEach(k => { if (k === prefix || k.indexOf(prefix + ':') === 0) mp.delete(k); }));
}
function dataChanged(moduleKey) { dropCache('summary'); dropCache('audit'); if (moduleKey) dropCache('list:' + moduleKey); }
function fetchInto(key, action, data) {
  if (INFLIGHT.has(key)) return INFLIGHT.get(key);
  const gen = GEN;
  const p = api(action, data).then(r => { const e = { data: r, json: JSON.stringify(r), at: Date.now() }; if (gen === GEN) CACHE.set(key, e); return e; });
  const done = () => { if (INFLIGHT.get(key) === p) INFLIGHT.delete(key); };
  p.then(done, done);
  INFLIGHT.set(key, p);
  return p;
}
/* onData(result) runs with the remembered copy straight away, and again if the server's copy differs. */
async function loadCached(key, action, data, onData, still) {
  const had = CACHE.get(key);
  if (had) onData(had.data);
  if (had && Date.now() - had.at < FRESH_MS) return;
  try {
    const e = await fetchInto(key, action, data);
    if (still() && (!had || had.json !== e.json)) onData(e.data);
  } catch (err) {
    if (!had) throw err;
    if (still() && err.code !== 'SESSION_EXPIRED') toast('Could not refresh: ' + err.message, 'bad');
  }
}
function prefetch(key, action, data) { if (!CACHE.has(key)) fetchInto(key, action, data).catch(() => {}); }

function modal(html, onReady) {
  const o = document.createElement('div');
  o.className = 'overlay';
  o.innerHTML = '<div class="modal">' + html + '</div>';
  document.body.appendChild(o);
  const close = () => o.remove();
  if (onReady) onReady(o, close);
  return close;
}

function confirmBox(title, text, okLabel) {
  return new Promise(resolve => {
    modal('<h2>' + esc(title) + '</h2><p>' + esc(text) + '</p><div class="row" style="justify-content:flex-end;margin-top:18px">' +
      '<button class="btn ghost" data-a="no">Cancel</button><button class="btn danger" data-a="yes">' + esc(okLabel || 'Confirm') + '</button></div>',
      (o, close) => {
        o.querySelector('[data-a=no]').onclick = () => { close(); resolve(false); };
        o.querySelector('[data-a=yes]').onclick = () => { close(); resolve(true); };
      });
  });
}

function download(name, content, type) {
  const blob = content instanceof Blob ? content : new Blob([content], { type: type || 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function toCSV(headers, rows) {
  const q = v => { const s = String(v == null ? '' : v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return '﻿' + [headers.map(q).join(',')].concat(rows.map(r => headers.map(h => q(r[h])).join(','))).join('\r\n');
}

function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows;
}

/* ---------- validation (same rules as the server) ---------- */
const MONTHS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
function pad2(n) { return String(n).padStart(2, '0'); }
function ymd(y, m, d) {
  const dt = new Date(Date.UTC(y, m - 1, d));
  if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d || y < 1900 || y > 2200) return null;
  return y + '-' + pad2(m) + '-' + pad2(d);
}
function normNumber(v) {
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s = String(v == null ? '' : v).trim();
  if (!s) return '';
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  s = s.replace(/^(TZS|TSH|USD)\s*/i, '').replace(/[,\s]/g, '');
  if (!/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s)) return null;
  const n = Number(s);
  return neg ? -n : n;
}
function normDate(v) {
  if (v instanceof Date) {
    if (isNaN(v.getTime())) return null;
    const t = new Date(v.getTime() + 3600000);
    return ymd(t.getFullYear(), t.getMonth() + 1, t.getDate());
  }
  if (typeof v === 'number') {
    if (v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 86400000)); return ymd(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()); }
    return null;
  }
  const s = String(v == null ? '' : v).trim();
  if (!s) return '';
  let m;
  if ((m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})(?:[T\s].*)?$/))) return ymd(+m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})(?:\s.*)?$/))) return ymd(+m[3], +m[2], +m[1]);
  if ((m = s.match(/^(\d{1,2})[-\s]([A-Za-z]{3})[A-Za-z]*[-\s,]+(\d{4})$/))) {
    const mi = MONTHS.indexOf(m[2].toLowerCase());
    return mi < 0 ? null : ymd(+m[3], mi + 1, +m[1]);
  }
  return null;
}
function cleanRow(mod, src) {
  const row = {}, errs = [];
  mod.columns.forEach(c => {
    let v = src[c.name];
    if (v === undefined || v === null) v = '';
    if (c.type === 'number') {
      const n = normNumber(v);
      if (n === null) { errs.push(c.name + ' "' + v + '" is not a number'); v = String(v); } else v = n;
    } else if (c.type === 'date') {
      const d = normDate(v);
      if (d === null) { errs.push(c.name + ' "' + v + '" is not a valid date'); v = String(v); } else v = d;
    } else {
      v = String(v).trim();
      if (c.type === 'select' && v) {
        const opt = (c.options || []).find(o => o.toLowerCase() === v.toLowerCase());
        if (!opt) errs.push(c.name + ' must be one of: ' + c.options.join(', ')); else v = opt;
      }
      if (v.length > 500) errs.push(c.name + ' is too long');
    }
    if (c.required && v === '') errs.push(c.name + ' is required');
    row[c.name] = v;
  });
  return { row: row, errs: errs };
}

/* ---------------- auth ---------------- */
function showLogin() {
  $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden');
  showPinForm(false);
}

/* mode: 'setup' (first time), 'reset' (forgot password), 'code' (already has a code from an email) */
function showPinForm(show, mode) {
  $('#loginForm').classList.toggle('hidden', show);
  $('#pinForm').classList.toggle('hidden', !show);
  $('#loginMsg').innerHTML = ''; $('#pinMsg').innerHTML = '';
  if (!show) { setTimeout(() => $('#lu').focus(), 50); return; }
  const reset = mode === 'reset';
  $('#pinTitle').textContent = reset ? 'Reset your password' : 'New user setup';
  $('#pinIntro').textContent = reset
    ? 'Enter your CRDB work email. We will email you a 6-digit code to set a new password.'
    : 'Enter your CRDB work email. We will email you a 6-digit code to set your password. Your username is made from your email automatically.';
  const typed = $('#lu').value.trim();
  if (!$('#pe').value && typed.indexOf('@') > 0) $('#pe').value = typed;
  setStep2(mode === 'code');
  setTimeout(() => (!$('#pe').value ? $('#pe') : mode === 'code' ? $('#pp') : $('#pinSend')).focus(), 50);
}

function setStep2(on) {
  $('#pinStep2').classList.toggle('hidden', !on);
  $('#haveCodeP').classList.toggle('hidden', on);
  $('#pinSend').className = on ? 'btn ghost block' : 'btn block';
  $('#pinSend').textContent = on ? 'Send me a new code' : 'Send me a code';
}

$('#toSetup').onclick = () => showPinForm(true, 'setup');
$('#toReset').onclick = () => showPinForm(true, 'reset');
$('#toLogin').onclick = () => showPinForm(false);
$('#haveCode').onclick = () => { setStep2(true); $('#pinMsg').innerHTML = ''; ($('#pe').value ? $('#pp') : $('#pe')).focus(); };

async function sendCode() {
  const em = $('#pe').value.trim(), m = $('#pinMsg'), b = $('#pinSend');
  if (!em) { m.innerHTML = '<div class="msg bad">Enter your work email.</div>'; $('#pe').focus(); return; }
  const label = b.textContent;
  b.disabled = true; b.textContent = 'Sending…';
  try {
    const r = await api('requestPin', { email: em });
    setStep2(true);
    m.innerHTML = '<div class="msg ok">' + esc(r.message) + '</div>';
    $('#pp').focus();
  } catch (err) { b.textContent = label; m.innerHTML = '<div class="msg bad">' + esc(err.message) + '</div>'; }
  finally { b.disabled = false; }
}
$('#pinSend').onclick = sendCode;

$('#pinForm').addEventListener('submit', async e => {
  e.preventDefault();
  if ($('#pinStep2').classList.contains('hidden')) return sendCode();   // Enter on the first step sends the code
  const m = $('#pinMsg'), btn = $('#pinBtn'), p1 = $('#pn1').value, p2 = $('#pn2').value;
  m.innerHTML = '';
  if (!$('#pe').value.trim()) { m.innerHTML = '<div class="msg bad">Enter your work email.</div>'; $('#pe').focus(); return; }
  if (!/^\d{6}$/.test($('#pp').value.trim())) { m.innerHTML = '<div class="msg bad">The code is the 6 digits from the email.</div>'; return; }
  if (p1 !== p2) { m.innerHTML = '<div class="msg bad">The new passwords do not match.</div>'; return; }
  if (!strongPw(p1)) { m.innerHTML = '<div class="msg bad">Use at least 8 characters with letters and numbers.</div>'; return; }
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const r = await api('setPasswordWithPin', { email: $('#pe').value.trim(), pin: $('#pp').value.trim(), newPassword: p1 });
    ['#pp', '#pn1', '#pn2'].forEach(s => { $(s).value = ''; });
    S.token = r.token; store.set('bp_token', r.token);
    S.user = r.user; S.modules = r.modules;
    showPinForm(false);
    enterApp();
    toast('Password set. Welcome, ' + r.user.name + '!');
  } catch (err) { m.innerHTML = '<div class="msg bad">' + esc(err.message) + '</div>'; }
  finally { btn.disabled = false; btn.textContent = 'Set password and sign in'; }
});

function signOutLocal() {
  S.token = null; S.user = null;
  clearCache();
  store.del('bp_token');
  document.querySelectorAll('.overlay').forEach(o => o.remove());
  showLogin();
}

$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#loginBtn'), msg = $('#loginMsg');
  msg.innerHTML = '';
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const r = await api('login', { username: $('#lu').value.trim(), password: $('#lp').value });
    S.token = r.token; store.set('bp_token', r.token);
    S.user = r.user; S.modules = r.modules;
    $('#lp').value = '';
    enterApp();
  } catch (err) {
    msg.innerHTML = '<div class="msg bad">' + esc(err.message) + '</div>';
  } finally { btn.disabled = false; btn.textContent = 'Sign in'; }
});

$('#outBtn').onclick = async () => { try { await api('logout'); } catch (e) {} signOutLocal(); };
$('#pwBtn').onclick = () => changePassword(false);

function changePassword(forced) {
  if (document.querySelector('#pwForm')) return;
  modal('<h2>' + (forced ? 'Set your own password' : 'Change password') + '</h2>' +
    (forced ? '<p class="muted">You signed in with a temporary password. Choose a new one to continue.</p>' : '') +
    '<form id="pwForm"><label>Current password</label><input type="password" id="pw0" autocomplete="current-password" required>' +
    '<label>New password</label><input type="password" id="pw1" autocomplete="new-password" required>' +
    '<label>Confirm new password</label><input type="password" id="pw2" autocomplete="new-password" required>' +
    '<p class="muted">At least 8 characters, with letters and numbers.</p><div id="pwMsg"></div>' +
    '<div class="row" style="justify-content:flex-end;margin-top:14px">' +
    (forced ? '<button type="button" class="btn ghost" id="pwOut">Sign out</button>' : '<button type="button" class="btn ghost" id="pwCancel">Cancel</button>') +
    '<button class="btn" type="submit">Save password</button></div></form>',
    (o, close) => {
      if (forced) o.querySelector('#pwOut').onclick = () => { close(); $('#outBtn').click(); };
      else o.querySelector('#pwCancel').onclick = close;
      o.querySelector('#pw0').focus();
      o.querySelector('#pwForm').onsubmit = async e => {
        e.preventDefault();
        const p0 = $('#pw0').value, p1 = $('#pw1').value, p2 = $('#pw2').value, m = $('#pwMsg');
        if (p1 !== p2) { m.innerHTML = '<div class="msg bad">The new passwords do not match.</div>'; return; }
        if (!strongPw(p1)) { m.innerHTML = '<div class="msg bad">Use at least 8 characters with letters and numbers.</div>'; return; }
        try {
          const r = await api('changePassword', { oldPassword: p0, newPassword: p1 });
          S.user = r.user; close(); toast('Password changed.'); render();
        } catch (err) { m.innerHTML = '<div class="msg bad">' + esc(err.message) + '</div>'; }
      };
    });
}

function enterApp() {
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#whoName').textContent = S.user.name + (isAdmin() ? ' · ' + ROLE_LABEL[S.user.role] : '');
  if (S.user.mustChange) changePassword(true);
  go('dashboard');
}

/* ---------------- navigation ---------------- */
function renderNav() {
  const b = (view, mod, label) => '<button data-v="' + view + '" data-m="' + esc(mod || '') + '" class="' +
    ((S.view === view && (S.mod || '') === (mod || '')) ? 'on' : '') + '">' + esc(label) + '</button>';
  let h = b('dashboard', '', 'Dashboard') + '<h6>Inputs</h6>';
  S.modules.forEach(m => { h += b('module', m.key, m.title); });
  if (isAdmin()) h += '<h6>Administration</h6>' + b('users', '', 'Users') + b('audit', '', 'Audit log');
  const nav = $('#nav');
  nav.innerHTML = h;
  nav.querySelectorAll('button').forEach(btn => { btn.onclick = () => go(btn.dataset.v, btn.dataset.m || null); });
}

function go(view, mod) { S.view = view; S.mod = mod || null; if (view === 'module') S.tab = 'manual'; render(); }

function render() {
  if (!S.user) return;
  renderNav();
  const main = $('#main');
  main.scrollTop = 0;
  if (S.view === 'dashboard') return viewDashboard(main);
  if (S.view === 'module') return viewModule(main, S.modules.find(m => m.key === S.mod));
  if (S.view === 'users') return viewUsers(main);
  if (S.view === 'audit') return viewAudit(main);
}

/* ---------------- dashboard ---------------- */
function viewDashboard(main) {
  main.innerHTML = '<h1>Dashboard</h1><p class="sub">Welcome, ' + esc(S.user.name) + '. Records held for each input, with control totals.</p><div class="grid" id="dash"><div class="card muted">Loading…</div></div>';
  const still = () => S.view === 'dashboard' && !!$('#dash');
  loadCached('summary', 'summary', {}, r => {
    if (!still()) return;
    $('#dash').innerHTML = r.modules.map(m => {
      let t = Object.keys(m.totals).map(k => esc(k) + ': <b>' + fmt(m.totals[k]) + '</b>').join('<br>');
      let chk = '';
      if (m.check && m.count) {
        const diff = (m.totals[m.check[0]] || 0) - (m.totals[m.check[1]] || 0);
        chk = Math.abs(diff) < 0.005 ? '<span class="pill ok">Balanced</span>' : '<span class="pill bad">Out by ' + fmt(diff) + '</span>';
      } else if (!m.count) chk = '<span class="pill mute">No data yet</span>';
      return '<div class="card stat" data-k="' + esc(m.key) + '"><div class="row"><h3>' + esc(m.title) + '</h3><span class="spacer"></span>' + chk + '</div>' +
        '<div class="n">' + m.count.toLocaleString() + '</div><div class="muted">records</div><div class="t">' + t + '</div>' +
        (m.lastAt ? '<div class="t">Last entry: ' + esc(m.lastAt) + '</div>' : '') + '</div>';
    }).join('');
    document.querySelectorAll('.stat').forEach(c => { c.onclick = () => go('module', c.dataset.k); });
  }, still).catch(err => { if (still()) $('#dash').innerHTML = '<div class="msg bad">' + esc(err.message) + '</div>'; });
}

/* ---------------- input module ---------------- */
function viewModule(main, m) {
  if (!m) return go('dashboard');
  main.innerHTML = '<div class="row"><div><h1>' + esc(m.title) + '</h1><p class="sub">' + esc(m.description) + '</p></div><span class="spacer"></span>' +
    '<button class="btn ghost" id="sCsv">Sample format (CSV)</button><button class="btn ghost" id="sXls">Sample format (Excel)</button></div>' +
    '<div class="tabs"><button data-t="manual">Enter manually</button><button data-t="upload">Upload file</button><button data-t="records">Records</button></div><div id="tab"></div>';
  $('#sCsv').onclick = () => download(m.key + '_sample.csv', toCSV(m.columns.map(c => c.name), []));
  $('#sXls').onclick = () => sampleExcel(m);
  main.querySelectorAll('.tabs button').forEach(b => {
    b.classList.toggle('on', b.dataset.t === S.tab);
    b.onclick = () => { S.tab = b.dataset.t; viewModule(main, m); };
  });
  const tab = $('#tab');
  prefetch('list:' + m.key, 'list', { module: m.key });
  if (S.tab === 'manual') tabManual(tab, m);
  else if (S.tab === 'upload') tabUpload(tab, m);
  else tabRecords(tab, m);
}

function sampleExcel(m) {
  if (!window.XLSX) { toast('Excel library did not load — use the CSV sample.', 'bad'); return; }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([m.columns.map(c => c.name)]), 'Data');
  const guide = [['Column', 'Type', 'Required', 'Notes']].concat(m.columns.map(c => [c.name, c.type, c.required ? 'Yes' : 'No',
    c.type === 'date' ? 'YYYY-MM-DD or DD/MM/YYYY' : c.type === 'number' ? 'Numbers only, e.g. 1500000.00' : c.type === 'select' ? 'One of: ' + c.options.join(', ') : '']));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(guide), 'Guide');
  XLSX.writeFile(wb, m.key + '_sample.xlsx');
}

function fieldHtml(c, i) {
  const id = 'f' + i, lab = '<label for="' + id + '">' + esc(c.name) + (c.required ? ' <span class="req">*</span>' : '') + '</label>';
  if (c.type === 'select') return '<div>' + lab + '<select id="' + id + '"><option value="">— choose —</option>' + c.options.map(o => '<option>' + esc(o) + '</option>').join('') + '</select></div>';
  if (c.type === 'date') return '<div>' + lab + '<input id="' + id + '" type="date"></div>';
  if (c.type === 'number') return '<div>' + lab + '<input id="' + id + '" type="text" inputmode="decimal" placeholder="0.00"></div>';
  return '<div>' + lab + '<input id="' + id + '" type="text"></div>';
}

function tabManual(tab, m) {
  tab.innerHTML = '<form class="card" id="mForm"><div class="form">' + m.columns.map(fieldHtml).join('') + '</div><div id="mMsg"></div>' +
    '<div class="row" style="margin-top:16px"><button class="btn" type="submit">Save record</button><button class="btn ghost" type="reset">Clear</button></div></form>';
  $('#mForm').onsubmit = async e => {
    e.preventDefault();
    const src = {};
    m.columns.forEach((c, i) => { src[c.name] = $('#f' + i).value; });
    const r = cleanRow(m, src), msg = $('#mMsg');
    if (r.errs.length) { msg.innerHTML = '<div class="msg bad">' + r.errs.map(esc).join('<br>') + '</div>'; return; }
    try {
      await api('add', { module: m.key, rows: [r.row] });
      dataChanged(m.key);
      msg.innerHTML = '<div class="msg ok">Saved.</div>';
      $('#mForm').reset();
      $('#f0').focus();
    } catch (err) { msg.innerHTML = '<div class="msg bad">' + esc(err.message) + '</div>'; }
  };
}

async function readFile(file) {
  const buf = await file.arrayBuffer();
  if (/\.csv$/i.test(file.name)) return parseCSV(new TextDecoder('utf-8').decode(buf));
  if (!/\.(xlsx|xls|xlsm)$/i.test(file.name)) throw new Error('Please upload a .csv, .xlsx or .xls file.');
  if (!window.XLSX) throw new Error('The Excel reader did not load. Save the file as CSV and upload that instead.');
  const wb = XLSX.read(buf, { type: 'array', cellDates: true });
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '' });
}

function tabUpload(tab, m) {
  tab.innerHTML = '<div class="card"><input type="file" id="file" accept=".csv,.xlsx,.xls,.xlsm" class="hidden">' +
    '<div class="drop" id="drop"><b>Click to choose a file</b> or drag it here<br><span class="muted">CSV or Excel. The first row must hold the column names from the sample format; data from the first sheet is used.</span></div>' +
    '<div id="upOut"></div></div>';
  const input = $('#file'), drop = $('#drop');
  drop.onclick = () => input.click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files[0]) handle(e.dataTransfer.files[0]); };
  input.onchange = () => { if (input.files[0]) handle(input.files[0]); input.value = ''; };

  async function handle(file) {
    const out = $('#upOut');
    out.innerHTML = '<p class="muted">Reading ' + esc(file.name) + '…</p>';
    let grid;
    try { grid = await readFile(file); } catch (err) { out.innerHTML = '<div class="msg bad">' + esc(err.message) + '</div>'; return; }
    grid = grid.filter(r => r.some(c => String(c).trim() !== ''));
    if (grid.length < 2) { out.innerHTML = '<div class="msg bad">The file has no data rows under the header.</div>'; return; }
    if (grid.length > 20001) { out.innerHTML = '<div class="msg bad">Too many rows (max 20,000 per file). Split the file.</div>'; return; }
    const head = grid[0].map(keyOf), idx = {};
    m.columns.forEach(c => { const i = head.indexOf(keyOf(c.name)); if (i >= 0) idx[c.name] = i; });
    const missingReq = m.columns.filter(c => c.required && idx[c.name] === undefined).map(c => c.name);
    if (missingReq.length) {
      out.innerHTML = '<div class="msg bad">These required columns are missing from the first row: <b>' + missingReq.map(esc).join(', ') +
        '</b>.<br>Download the sample format above and copy your data into it.</div>'; return;
    }
    const missingOpt = m.columns.filter(c => idx[c.name] === undefined).map(c => c.name);
    const parsed = grid.slice(1).map((r, n) => {
      const src = {};
      m.columns.forEach(c => { src[c.name] = idx[c.name] === undefined ? '' : r[idx[c.name]]; });
      const cr = cleanRow(m, src);
      cr.line = n + 2;
      return cr;
    });
    const bad = parsed.filter(p => p.errs.length);
    const nums = m.columns.filter(c => c.type === 'number' && c.sum !== false);
    const totals = {}; nums.forEach(c => { totals[c.name] = parsed.reduce((s, p) => s + (typeof p.row[c.name] === 'number' ? p.row[c.name] : 0), 0); });
    let h = '<div class="row" style="margin:16px 0 10px"><b>' + esc(file.name) + '</b><span class="pill ' + (bad.length ? 'bad' : 'ok') + '">' +
      parsed.length.toLocaleString() + ' rows · ' + (bad.length ? bad.length + ' with errors' : 'all valid') + '</span><span class="spacer"></span>' +
      '<button class="btn" id="saveUp"' + (bad.length ? ' disabled' : '') + '>Save ' + parsed.length.toLocaleString() + ' rows</button></div>';
    if (missingOpt.length) h += '<div class="msg warn">Optional columns not in the file (left blank): ' + missingOpt.map(esc).join(', ') + '</div>';
    if (bad.length) h += '<div class="msg bad"><b>Fix these rows in your file and upload again:</b><br>' +
      bad.slice(0, 15).map(p => 'Row ' + p.line + ': ' + p.errs.map(esc).join('; ')).join('<br>') + (bad.length > 15 ? '<br>…and ' + (bad.length - 15) + ' more.' : '') + '</div>';
    h += '<p class="muted">Preview of the first 50 rows:</p><div class="tbl-wrap"><table><thead><tr><th>Row</th>' +
      m.columns.map(c => '<th class="' + (c.type === 'number' ? 'num' : '') + '">' + esc(c.name) + '</th>').join('') + '</tr></thead><tbody>' +
      parsed.slice(0, 50).map(p => '<tr class="' + (p.errs.length ? 'err' : '') + '"><td>' + p.line + '</td>' +
        m.columns.map(c => '<td class="' + (c.type === 'number' ? 'num' : '') + '">' + (c.type === 'number' ? fmt(p.row[c.name]) : esc(p.row[c.name])) + '</td>').join('') + '</tr>').join('') +
      '</tbody>' + (nums.length ? '<tfoot><tr><td>Total</td>' + m.columns.map(c => '<td class="num">' + (totals[c.name] !== undefined ? fmt(totals[c.name]) : '') + '</td>').join('') + '</tr></tfoot>' : '') +
      '</table></div>';
    out.innerHTML = h;
    const btn = $('#saveUp');
    if (btn) btn.onclick = async () => {
      btn.disabled = true;
      const batch = 'B' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const rows = parsed.map(p => p.row);
      let done = 0;
      try {
        for (let i = 0; i < rows.length; i += 500) {
          btn.textContent = 'Saving ' + done.toLocaleString() + ' / ' + rows.length.toLocaleString() + '…';
          await api('add', { module: m.key, rows: rows.slice(i, i + 500), batch: batch });
          done += Math.min(500, rows.length - i);
        }
        dataChanged(m.key);
        out.innerHTML = '<div class="msg ok">Saved ' + done.toLocaleString() + ' rows from ' + esc(file.name) + '. Upload reference: ' + batch + '</div>';
        toast('Upload saved.');
      } catch (err) {
        if (done) dataChanged(m.key);
        out.insertAdjacentHTML('afterbegin', '<div class="msg bad">' + esc(err.message) + (done ? ' — ' + done + ' rows were saved before the error (reference ' + batch + '). An administrator can delete this upload from the Records tab and you can upload again.' : '') + '</div>');
        btn.textContent = 'Save failed';
      }
    };
  }
}

function tabRecords(tab, m) {
  tab.innerHTML = '<div class="card muted">Loading records…</div>';
  const still = () => S.view === 'module' && S.mod === m.key && S.tab === 'records' && document.body.contains(tab);
  loadCached('list:' + m.key, 'list', { module: m.key }, r => { if (still()) drawRecords(tab, m, r); }, still)
    .catch(err => { if (still()) tab.innerHTML = '<div class="msg bad">' + esc(err.message) + '</div>'; });
}

function drawRecords(tab, m, r) {
  const prevQ = $('#q') ? $('#q').value : '';
  const canDelete = isAdmin();
  const all = r.rows;
  const batches = {};
  all.forEach(x => { if (x._batch) { batches[x._batch] = batches[x._batch] || { n: 0, at: x._createdAt, by: x._createdBy }; batches[x._batch].n++; } });
  const cols = m.columns.map(c => c.name);
  tab.innerHTML = '<div class="card"><div class="row"><input type="search" id="q" placeholder="Search records…" style="max-width:320px">' +
    '<span class="muted" id="cnt"></span><span class="spacer"></span><button class="btn ghost" id="exp">Export CSV</button></div>' +
    (canDelete && Object.keys(batches).length ? '<div class="row" style="margin-top:12px"><select id="bsel" style="max-width:460px"><option value="">Delete a whole upload…</option>' +
      Object.keys(batches).map(b => '<option value="' + esc(b) + '">' + esc(b) + ' — ' + batches[b].n + ' rows by ' + esc(batches[b].by) + ' at ' + esc(batches[b].at) + '</option>').join('') +
      '</select><button class="btn danger sm" id="bdel">Delete upload</button></div>' : '') +
    (r.total > all.length ? '<div class="msg warn">Showing the latest ' + all.length.toLocaleString() + ' of ' + r.total.toLocaleString() + ' records.</div>' : '') +
    '<div class="tbl-wrap" style="margin-top:12px" id="tw"></div></div>';
  let shown = all;
  function draw() {
    const q = $('#q').value.trim().toLowerCase();
    shown = q ? all.filter(x => cols.concat(['_createdBy']).some(c => String(x[c]).toLowerCase().indexOf(q) >= 0)) : all;
    const lim = shown.slice(0, 1000);
    const nums = m.columns.filter(c => c.type === 'number' && c.sum !== false);
    $('#cnt').textContent = shown.length.toLocaleString() + ' record(s)' + (shown.length > 1000 ? ' — first 1,000 shown; Export CSV includes all' : '');
    $('#tw').innerHTML = !shown.length ? '<p class="muted" style="padding:14px">No records.</p>' :
      '<table><thead><tr>' + m.columns.map(c => '<th class="' + (c.type === 'number' ? 'num' : '') + '">' + esc(c.name) + '</th>').join('') +
      '<th>Entered by</th><th>Entered at</th>' + (canDelete ? '<th></th>' : '') + '</tr></thead><tbody>' +
      lim.map(x => '<tr>' + m.columns.map(c => '<td class="' + (c.type === 'number' ? 'num' : '') + '">' + (c.type === 'number' && x[c.name] !== '' ? fmt(Number(x[c.name])) : esc(x[c.name])) + '</td>').join('') +
        '<td>' + esc(x._createdBy) + '</td><td>' + esc(x._createdAt) + '</td>' + (canDelete ? '<td><button class="btn danger sm" data-id="' + esc(x._id) + '">Delete</button></td>' : '') + '</tr>').join('') +
      '</tbody>' + (nums.length ? '<tfoot><tr>' + m.columns.map((c, i) => '<td class="num">' + (c.type === 'number' && c.sum !== false ? fmt(shown.reduce((s, x) => s + (Number(x[c.name]) || 0), 0)) : (i === 0 ? 'Total' : '')) + '</td>').join('') + '<td></td><td></td>' + (canDelete ? '<td></td>' : '') + '</tr></tfoot>' : '') + '</table>';
    $('#tw').querySelectorAll('[data-id]').forEach(b => {
      b.onclick = async () => {
        if (!(await confirmBox('Delete record', 'Delete this record permanently? This is recorded in the audit log.', 'Delete'))) return;
        try { await api('remove', { module: m.key, id: b.dataset.id }); dataChanged(m.key); toast('Record deleted.'); tabRecords(tab, m); } catch (err) { toast(err.message, 'bad'); }
      };
    });
  }
  $('#q').value = prevQ;
  $('#q').oninput = draw;
  $('#exp').onclick = () => download(m.key + '_records.csv', toCSV(cols.concat(['_createdBy', '_createdAt', '_batch']), shown));
  const bdel = $('#bdel');
  if (bdel) bdel.onclick = async () => {
    const b = $('#bsel').value;
    if (!b) { toast('Choose an upload first.', 'bad'); return; }
    if (!(await confirmBox('Delete upload', 'Delete all ' + batches[b].n + ' rows from upload ' + b + '? This cannot be undone.', 'Delete upload'))) return;
    try { const x = await api('removeBatch', { module: m.key, batch: b }); dataChanged(m.key); toast(x.removed + ' rows deleted.'); tabRecords(tab, m); } catch (err) { toast(err.message, 'bad'); }
  };
  draw();
}

/* ---------------- admin: users ---------------- */
function showPin(title, r) {
  const body = r.emailed
    ? '<p>A 6-digit code was emailed to <b>' + esc(r.email) + '</b> for user <b>' + esc(r.username) + '</b>. It is valid for ' + esc(r.hours) + ' hours.</p>' +
      '<p class="muted">They open the portal, click <b>New user setup → I already have a code</b>, enter their work email, the code and a password. Afterwards they sign in with <b>' + esc(r.username) + '</b> or their work email. If the email does not arrive, ask them to check junk, or click <b>Send code</b> again.</p>'
    : '<div class="msg warn">The email could not be sent' + (r.email ? ' to ' + esc(r.email) : ' (no email on file)') + '. Give this code to <b>' + esc(r.username) +
      '</b> privately, e.g. by phone. It is valid for ' + esc(r.hours) + ' hours.</div><div class="secret">' + esc(r.pin) + '</div>' +
      '<p class="muted">They open the portal, click <b>New user setup → I already have a code</b>, enter their work email (or username <b>' + esc(r.username) + '</b>), the code and a password.</p>';
  modal('<h2>' + esc(title) + '</h2>' + body + '<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="ok">Done</button></div>',
    (o, close) => { o.querySelector('#ok').onclick = close; });
}

function editEmail(username, current) {
  modal('<h2>Change email</h2><p>Work email for <b>' + esc(username) + '</b>. Password codes are sent to this address.</p>' +
    '<form id="eForm"><input type="email" id="ee" required value="' + esc(current) + '"><div id="eMsg"></div>' +
    '<div class="row" style="justify-content:flex-end;margin-top:14px"><button type="button" class="btn ghost" id="eCancel">Cancel</button><button class="btn" type="submit">Save email</button></div></form>',
    (o, close) => {
      o.querySelector('#eCancel').onclick = close;
      o.querySelector('#ee').focus();
      o.querySelector('#eForm').onsubmit = async e => {
        e.preventDefault();
        try { await api('setUserEmail', { username: username, email: o.querySelector('#ee').value.trim() }); close(); toast('Email updated.'); usersChanged(); }
        catch (err) { o.querySelector('#eMsg').innerHTML = '<div class="msg bad">' + esc(err.message) + '</div>'; }
      };
    });
}

async function viewUsers(main) {
  main.innerHTML = '<h1>Users</h1><p class="sub">' + (isMaster()
      ? 'Create accounts, send password codes and switch access on or off — for users and administrators.'
      : 'Create user accounts, send password codes and switch access on or off. Administrator accounts are managed by the master administrator.') + '</p>' +
    '<form class="card" id="uForm"><div class="form">' +
    '<div><label for="uf">Full name</label><input id="uf" type="text" required></div>' +
    '<div><label for="ue">Work email</label><input id="ue" type="email" placeholder="name@crdbbank.co.tz" required><div class="muted" id="unPrev" style="margin-top:4px"></div></div>' +
    '<div><label for="ur">Role</label><select id="ur"><option value="user">User</option>' + (isMaster() ? '<option value="admin">Administrator</option>' : '') + '</select></div></div>' +
    '<p class="muted">The username is made from the email (first letter + surname). The person is emailed a 6-digit code to set their password, or can use <b>New user setup</b> on the sign-in page later.</p>' +
    '<div id="uMsg"></div><button class="btn" id="uBtn" type="submit" style="margin-top:6px">Create user</button></form>' +
    '<div class="card" id="uList"><p class="muted">Loading…</p></div>';
  $('#uForm').onsubmit = async e => {
    e.preventDefault();
    const btn = $('#uBtn');
    btn.disabled = true;
    try {
      const r = await api('addUser', { name: $('#uf').value, email: $('#ue').value, role: $('#ur').value });
      $('#uForm').reset(); $('#uMsg').innerHTML = ''; $('#unPrev').textContent = '';
      showPin('User created', r);
      usersChanged();
    } catch (err) { $('#uMsg').innerHTML = '<div class="msg bad">' + esc(err.message) + '</div>'; }
    finally { btn.disabled = false; }
  };
  $('#ue').oninput = () => {
    const v = $('#ue').value.trim();
    $('#unPrev').textContent = /^[^@\s]+@[^@\s]+$/.test(v) ? 'Username: ' + usernameFromEmail(v) + ' (a number is added if it is taken)' : '';
  };
  loadUsers();
}

/* same rule as the server: kelvin.njelekela@… -> knjelekela */
function usernameFromEmail(email) {
  const parts = String(email).split('@')[0].toLowerCase().split(/[._-]+/).map(x => x.replace(/[^a-z0-9]/g, '')).filter(Boolean);
  let base = parts.length >= 2 ? parts[0].charAt(0) + parts[parts.length - 1] : (parts[0] || '');
  if (base.length < 3) base = parts.join('');
  if (base.length < 3) base = base + 'user';
  return base.slice(0, 26);
}

function statusPill(u) {
  if (!u.active) return '<span class="pill bad">Disabled</span>';
  if (!u.lastLogin) return '<span class="pill mute">' + (u.pinPending ? 'Code sent · awaiting first sign-in' : 'Awaiting first sign-in') + '</span>';
  return '<span class="pill ok">Active</span>' + (u.pinPending ? ' <span class="pill mute">Code sent</span>' : '');
}

function usersChanged() { dropCache('listUsers'); dropCache('audit'); loadUsers(); }

function loadUsers() {
  const box = $('#uList');
  const still = () => S.view === 'users' && document.body.contains(box);
  loadCached('listUsers', 'listUsers', {}, r => { if (still()) drawUsers(box, r); }, still)
    .catch(err => { if (still()) box.innerHTML = '<div class="msg bad">' + esc(err.message) + '</div>'; });
}

function drawUsers(box, r) {
  {
    const order = { master: 0, admin: 1, user: 2 };
    const users = r.users.slice().sort((a, b) => (order[a.role] - order[b.role]) || a.username.localeCompare(b.username));
    const byName = {};
    users.forEach(u => { byName[u.username] = u; });
    box.innerHTML = '<div class="tbl-wrap"><table><thead><tr><th>Username</th><th>Name</th><th>Work email</th><th>Role</th><th>Status</th><th>Last sign-in</th><th></th></tr></thead><tbody>' +
      users.map(u => {
        const me = u.username === S.user.username;
        let acts = '';
        if (u.canManage) {
          if (u.active) acts += '<button class="btn ghost sm" data-pin="' + esc(u.username) + '">Send code</button>';
          acts += '<button class="btn ghost sm" data-email="' + esc(u.username) + '">Email</button>';
          if (!me) acts += '<button class="btn ' + (u.active ? 'danger' : 'ghost') + ' sm" data-act="' + esc(u.username) + '" data-on="' + (u.active ? '0' : '1') + '">' + (u.active ? 'Disable' : 'Enable') + '</button>';
          if (isMaster() && !me && u.role !== 'master') acts += '<button class="btn ghost sm" data-role="' + esc(u.username) + '" data-to="' + (u.role === 'admin' ? 'user' : 'admin') + '">' + (u.role === 'admin' ? 'Make user' : 'Make admin') + '</button>';
          acts += '<button class="btn ghost sm" data-log="' + esc(u.username) + '">Activity</button>';
        } else acts = '<span class="muted">Managed by the master admin</span>';
        return '<tr><td>' + esc(u.username) + (me ? ' <span class="muted">(you)</span>' : '') + '</td><td>' + esc(u.name) + '</td><td>' + esc(u.email || '—') + '</td><td>' +
          esc(ROLE_LABEL[u.role] || u.role) + '</td><td>' + statusPill(u) + '</td><td>' + esc(u.lastLogin || '—') + '</td><td><div class="row" style="gap:6px;flex-wrap:nowrap">' + acts + '</div></td></tr>';
      }).join('') + '</tbody></table></div>';
    box.querySelectorAll('[data-pin]').forEach(b => {
      b.onclick = async () => {
        const u = byName[b.dataset.pin];
        if (!(await confirmBox('Send code', 'Email a new 6-digit code to ' + u.username + (u.email ? ' (' + u.email + ')' : ' (no email on file — the code will be shown to you)') +
          ' so they can set a new password? Their current password keeps working until they do. This also clears a "too many attempts" lock.', 'Send code'))) return;
        try { const x = await api('sendPin', { username: u.username }); showPin('Code sent', x); usersChanged(); } catch (err) { toast(err.message, 'bad'); }
      };
    });
    box.querySelectorAll('[data-email]').forEach(b => { b.onclick = () => editEmail(b.dataset.email, byName[b.dataset.email].email); });
    box.querySelectorAll('[data-act]').forEach(b => {
      b.onclick = async () => {
        const on = b.dataset.on === '1';
        if (!on && !(await confirmBox('Disable account', 'Disable ' + b.dataset.act + '? They are signed out at once and cannot sign in until enabled again.', 'Disable'))) return;
        try { await api('setUserActive', { username: b.dataset.act, active: on }); toast(on ? 'Account enabled.' : 'Account disabled.'); usersChanged(); } catch (err) { toast(err.message, 'bad'); }
      };
    });
    box.querySelectorAll('[data-role]').forEach(b => {
      b.onclick = async () => {
        const to = b.dataset.to;
        if (!(await confirmBox('Change role', 'Make ' + b.dataset.role + ' ' + (to === 'admin' ? 'an Administrator' : 'a regular User') + '?', 'Change role'))) return;
        try { await api('setUserRole', { username: b.dataset.role, role: to }); toast('Role changed.'); usersChanged(); } catch (err) { toast(err.message, 'bad'); }
      };
    });
    box.querySelectorAll('[data-log]').forEach(b => { b.onclick = () => { S.auditUser = b.dataset.log; go('audit'); }; });
  }
}

/* ---------------- admin: audit ---------------- */
const ACTION_LABEL = {
  login: 'Signed in', loginFailed: 'Failed sign-in', logout: 'Signed out', changePassword: 'Changed password',
  setPasswordWithPin: 'Set password with code', pinRequested: 'Requested a code by email', pinRequestIgnored: 'Code request refused',
  pinFailed: 'Wrong code', sendPin: 'Sent a code', resetPassword: 'Reset password', addUser: 'Created user',
  activateUser: 'Enabled user', deactivateUser: 'Disabled user', setRole: 'Changed role', setEmail: 'Changed email',
  addRow: 'Added record', upload: 'Uploaded file', deleteRow: 'Deleted record', deleteBatch: 'Deleted upload',
  createFirstAdmin: 'Master admin set up', resetAdminPassword: 'Master admin code issued', emailFailed: 'Email failed', testEmail: 'Test email sent'
};

async function viewAudit(main) {
  main.innerHTML = '<h1>Audit log</h1><p class="sub">' + (isMaster()
      ? 'Every action in the portal, by every user and administrator. Pick a user to see what they did and what was done to their account (latest 500 matching entries).'
      : 'Actions by regular users (latest 500 matching entries). Administrator activity is visible to the master administrator.') + '</p>' +
    '<div class="card"><div class="row"><select id="aUser" style="max-width:240px"><option value="">All users</option></select>' +
    '<select id="aKind" style="max-width:240px"><option value="">All activity</option><option value="signin">Sign-ins &amp; sign-outs</option>' +
    '<option value="access">Passwords &amp; codes</option><option value="users">User management</option><option value="data">Data entry &amp; deletions</option></select>' +
    '<span class="spacer"></span><span class="muted" id="aCnt"></span><button class="btn ghost" id="aExp">Export CSV</button></div>' +
    '<div class="tbl-wrap" style="margin-top:12px" id="aList"><p class="muted" style="padding:14px">Loading…</p></div></div>';
  const userSel = $('#aUser'), kindSel = $('#aKind');
  let entries = [], filled = false;
  let seq = 0;
  function load(user) {
    const kind = kindSel.value, list = $('#aList'), mine = ++seq;
    list.innerHTML = '<p class="muted" style="padding:14px">Loading…</p>';
    const still = () => S.view === 'audit' && document.body.contains(list) && mine === seq;
    loadCached('audit:' + user + ':' + kind, 'audit', { user: user, kind: kind }, r => { if (still()) drawAudit(r, user); }, still)
      .catch(err => { if (still()) list.innerHTML = '<div class="msg bad">' + esc(err.message) + '</div>'; });
  }
  function drawAudit(r, user) {
    {
      if (!filled) { r.users.forEach(n => userSel.insertAdjacentHTML('beforeend', '<option value="' + esc(n) + '">' + esc(n) + '</option>')); filled = true; }
      if (user && !Array.from(userSel.options).some(o => o.value === user)) userSel.insertAdjacentHTML('beforeend', '<option value="' + esc(user) + '">' + esc(user) + '</option>');
      userSel.value = user;
      entries = r.entries;
      $('#aCnt').textContent = entries.length.toLocaleString() + (entries.length === 1 ? ' entry' : ' entries');
      $('#aList').innerHTML = !entries.length ? '<p class="muted" style="padding:14px">No matching activity.</p>' :
        '<table><thead><tr><th>Time</th><th>User</th><th>Role</th><th>Action</th><th>Input</th><th>Detail</th></tr></thead><tbody>' +
        entries.map(x => '<tr class="' + (x.action === 'loginFailed' || x.action === 'pinFailed' ? 'err' : '') + '"><td>' + esc(x.time) + '</td><td>' + esc(x.username) + '</td><td>' +
          esc(ROLE_LABEL[x.role] || (x.role === 'system' ? 'System' : '—')) + '</td><td>' + esc(ACTION_LABEL[x.action] || x.action) + '</td><td>' + esc(x.module) + '</td><td>' + esc(x.detail) + '</td></tr>').join('') +
        '</tbody></table>';
    }
  }
  userSel.onchange = () => load(userSel.value);
  kindSel.onchange = () => load(userSel.value);
  $('#aExp').onclick = () => download('audit_log.csv', toCSV(['time', 'username', 'role', 'action', 'module', 'detail'],
    entries.map(x => Object.assign({}, x, { action: ACTION_LABEL[x.action] || x.action }))));
  const preset = S.auditUser || '';
  S.auditUser = '';
  load(preset);
}

/* ---------------- start ---------------- */
(async function start() {
  if (!S.token) {
    showLogin();
    if (location.hash === '#code' || location.hash === '#pin') showPinForm(true, 'code');
    else if (location.hash === '#setup') showPinForm(true, 'setup');
    return;
  }
  try { const r = await api('me'); S.user = r.user; S.modules = r.modules; enterApp(); }
  catch (e) { signOutLocal(); }
})();

})();
</script>
